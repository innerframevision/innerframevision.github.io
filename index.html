<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>INNER FRAME VISION — ATELIER SCRIPTORIUM</title>
<meta name="description" content="Inner Frame Vision — Atelier Scriptorium. An artistic space for manifestos, essays, literature and visual works.">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #100a07;
  overflow: hidden;
}

.entrance {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.artwork {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* Invisible interactive area over the three titles */

.title-link {
  position: absolute;
  left: 50%;
  top: 28%;
  transform: translateX(-50%);
  width: 43%;
  height: 34%;
  cursor: pointer;
  text-decoration: none;
  z-index: 2;
}

/* Golden illumination over the title area */

.title-link::after {
  content: "";
  position: absolute;
  inset: 0;
  opacity: 0;
  pointer-events: none;

background: radial-gradient(
  ellipse at center,
  rgba(190, 125, 65, 0.28) 0%,
  rgba(145, 85, 40, 0.12) 45%,
  transparent 75%
);

  mix-blend-mode: soft-light;
  transition: opacity 0.5s ease;
}

.title-link:hover::after,
.title-link:focus-visible::after {
  opacity: 1;
}

.title-link:focus-visible {
  outline: 2px solid #e6bb72;
  outline-offset: 4px;
}

@media (max-width: 700px) {
  .title-link {
    width: 65%;
    height: 24%;
    top: 34%;
  }
}
</style>
</head>

<body>

<main class="entrance">

  <img
    src="SCRIPTORIUM.png"
    alt="Inner Frame Vision — Atelier Scriptorium"
    class="artwork"
  >

  <a
    href="scriptorium.html"
    class="title-link"
    aria-label="Enter Inner Frame Vision Atelier Scriptorium"
  ></a>

</main>

</body>
</html>
