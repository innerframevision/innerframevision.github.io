<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scriptorium — Inner Frame Vision</title>
<meta name="description" content="Explore the manifestos and atelier of Inner Frame Vision.">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: #100a07;
}

.gallery {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 30px 15px;
}

.artwork {
  position: relative;
  width: 100%;
  max-width: 650px;
}

.artwork img {
  display: block;
  width: 100%;
  height: auto;
}

/* Two independent entrances */

.entrance {
  position: absolute;
  left: 8%;
  width: 84%;
  height: 42%;
  cursor: pointer;
  border-radius: 8px;
  transition: box-shadow 0.4s ease;
}

.manifestos {
  top: 4%;
}

.atelier {
  top: 54%;
}

.entrance:hover,
.entrance:focus-visible {
  box-shadow:
    inset 0 0 35px rgba(255, 205, 110, 0.22),
    0 0 22px rgba(255, 185, 75, 0.18);
}

.entrance:focus-visible {
  outline: 2px solid #e6bb72;
  outline-offset: 3px;
}

@media (max-width: 600px) {
  .gallery {
    padding: 15px 5px;
  }
}
</style>
</head>

<body>

<main class="gallery">

  <div class="artwork">

    <img
      src="scriptorium-entrances.jpg"
      alt="Inner Frame Vision — Manifestos and Atelier"
    >

    <a
      class="entrance manifestos"
      href="manifestos.html"
      aria-label="Enter Manifestos — Inner Frame Vision"
    ></a>

    <a
      class="entrance atelier"
      href="atelier.html"
      aria-label="Enter Atelier — Inner Frame Vision"
    ></a>

  </div>

</main>

</body>
</html>
