<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scriptorium — Inner Frame Vision</title>
<meta name="description" content="Explore the manifestos and atelier of Inner Frame Vision.">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: #100a07;
}

.gallery {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 0;
}

.artwork {
  position: relative;
  width: 100%;
  max-width: none;
}

.artwork img {
  display: block;
  width: 100%;
  height: auto;
}

/* Two independent entrances */

.entrance {
  position: absolute;
  left: 22%;
  width: 56%;
  height: 12%;
  cursor: pointer;
  background: transparent;
  border: none;
}

.manifestos {
  top: 16%;
}

.atelier {
  top: 66%;
}
.entrance:hover,
.entrance:focus-visible {
  background: radial-gradient(
    ellipse at center,
    rgba(255, 225, 150, 0.22) 0%,
    rgba(255, 195, 90, 0.08) 45%,
    transparent 75%
  );
}
.entrance:focus-visible {
  outline: 2px solid #e6bb72;
  outline-offset: 3px;
}

@media (max-width: 600px) {
  .gallery {
    padding: 15px 5px;
  }
}
</style>
</head>

<body>

<main class="gallery">

  <div class="artwork">

    <img
      src="scriptorium-entrances.jpg"
      alt="Inner Frame Vision — Manifestos and Atelier"
    >

    <a
      class="entrance manifestos"
      href="manifestos.html"
      aria-label="Enter Manifestos — Inner Frame Vision"
    ></a>

    <a
      class="entrance atelier"
      href="atelier.html"
      aria-label="Enter Atelier — Inner Frame Vision"
    ></a>

  </div>

</main>

</body>
</html>
